<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Availability - Peer Mentoring Hub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand-logo">
                <div class="logo-icon">M</div>
                <span>MentorHub</span>
            </a>
            <ul class="nav-links" id="navLinks"></ul>
        </div>
    </nav>

    <main class="container">
        <div style="margin-bottom: 2rem;">
            <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Manage Availability Slots</h1>
            <p style="color: var(--text-secondary);">Create 30-minute tutoring sessions for junior students to book.</p>
        </div>

        <div class="grid-3" style="align-items: start;">
            <!-- Form Card to Add New Slot -->
            <div class="card">
                <h3 style="margin-bottom: 1.25rem;">Add Available Slot</h3>
                
                <div id="availabilityAlert" style="display: none;"></div>

                <form id="availabilityForm" onsubmit="handleAddSlot(event)">
                    <div class="form-group">
                        <label class="form-label" for="slotDate">Date *</label>
                        <input type="date" id="slotDate" class="form-control" required>
                    </div>

                    <div class="grid-2">
                        <div class="form-group">
                            <label class="form-label" for="slotStartTime">Start Time *</label>
                            <input type="time" id="slotStartTime" class="form-control" required value="10:00">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="slotEndTime">End Time *</label>
                            <input type="time" id="slotEndTime" class="form-control" required value="10:30">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="slotSubjectSelect">Subject *</label>
                        <select id="slotSubjectSelect" class="form-control" required>
                            <option value="">-- Loading Subjects --</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                        + Add Availability
                    </button>
                </form>
            </div>

            <!-- Existing Slots List Table -->
            <div class="card" style="grid-column: span 2;">
                <h3 style="margin-bottom: 1.25rem;">Your Created Availability Slots</h3>
                
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Time Slot</th>
                                <th>Subject</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="slotsTableBody">
                            <tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Loading your slots...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Peer-to-Peer Academic Mentoring Hub</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/availability.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Set min date to today
            const today = new Date().toISOString().split('T')[0];
            document.getElementById("slotDate").min = today;
            document.getElementById("slotDate").value = today;

            loadTutorAvailability();
        });
    </script>
</body>
</html>
