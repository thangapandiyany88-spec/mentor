# Spring Boot Application Properties
spring.application.name=peer-mentoring-hub

# Server Port Configuration
server.port=8080

# MySQL Database Configuration
# Create the database in MySQL first: CREATE DATABASE peer_mentoring_db;
spring.datasource.url=jdbc:mysql://localhost:3306/peer_mentoring_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# SQL Script Execution Configuration for Initial Data Setup
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Logging Level Configuration
logging.level.org.springframework.web=INFO
logging.level.com.peermentoring=DEBUG
